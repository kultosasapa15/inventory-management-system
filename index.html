<!DOCTYPE html>
<html>
<head>
    <title>Inventory Management - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-box">

        <h1>Inventory Management</h1>
        <p class="subtitle">Store Inventory System</p>

        <!-- Login Form -->
        <div id="loginForm">

            <h2>Login</h2>

            <input type="text" id="loginUsername" placeholder="Username">

            <input type="password" id="loginPassword" placeholder="Password">

            <button onclick="login()">Login</button>

            <p id="loginMessage"></p>

            <p>
                Don't have an account?
                <a href="#" onclick="showSignup()">Sign Up</a>
            </p>

        </div>


        <!-- Sign Up Form -->
        <div id="signupForm" style="display: none;">

            <h2>Sign Up</h2>

            <input type="text" id="signupUsername" placeholder="Create Username">

            <input type="password" id="signupPassword" placeholder="Create Password">

            <input type="password" id="signupConfirm" placeholder="Confirm Password">

            <button onclick="signup()">Create Account</button>

            <p id="signupMessage"></p>

            <p>
                Already have an account?
                <a href="#" onclick="showLogin()">Login</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
